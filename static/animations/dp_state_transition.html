<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>动态规划状态转移交互动画</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(145deg, #eef6ff, #f8fafc); color: #14213d; }
    main { max-width: 980px; margin: 0 auto; padding: 28px; }
    header { display: flex; justify-content: space-between; gap: 24px; align-items: flex-start; }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 38px); }
    header p { max-width: 680px; margin: 10px 0 0; color: #53657d; line-height: 1.7; }
    .badge { padding: 7px 12px; border-radius: 999px; background: #dbeafe; color: #1d4ed8; font-size: 13px; font-weight: 700; white-space: nowrap; }
    .stage { position: relative; margin-top: 32px; padding: 30px; border: 1px solid #d8e5f5; border-radius: 22px; background: rgba(255,255,255,.92); box-shadow: 0 20px 60px rgba(42,78,125,.12); overflow: hidden; }
    .formula { text-align: center; font-family: Georgia, serif; font-size: clamp(22px, 4vw, 34px); color: #1e3a8a; }
    .stairs { display: flex; height: 250px; margin: 28px 0 18px; align-items: flex-end; justify-content: center; gap: 8px; }
    .step { position: relative; width: 112px; height: calc(52px + var(--i) * 34px); border: 2px solid #a8c8ef; border-radius: 12px 12px 4px 4px; background: #eff6ff; transition: .45s ease; }
    .step strong { position: absolute; inset: 12px 0 auto; text-align: center; font-size: 14px; }
    .step span { position: absolute; inset: auto 0 14px; text-align: center; color: #64748b; font-size: 13px; }
    .step.active { border-color: #2563eb; background: #dbeafe; transform: translateY(-8px); box-shadow: 0 12px 30px rgba(37,99,235,.22); }
    .step.done { border-color: #16a34a; background: #dcfce7; }
    .step.source { border-color: #f59e0b; background: #fef3c7; }
    .arrow { position: absolute; top: 76px; left: 50%; width: 140px; height: 3px; transform-origin: left center; background: #f59e0b; opacity: 0; transition: opacity .3s; }
    .arrow::after { content: ""; position: absolute; right: -1px; top: -5px; border-left: 10px solid #f59e0b; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
    .explain { min-height: 76px; padding: 15px 18px; border-radius: 14px; background: #f8fafc; color: #334155; line-height: 1.65; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    button { border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; font: inherit; font-weight: 700; }
    #play { background: #2563eb; color: white; }
    #next { background: #dbeafe; color: #1d4ed8; }
    #reset { background: #e2e8f0; color: #334155; }
    .timeline { flex: 1; min-width: 220px; display: flex; align-items: center; gap: 10px; }
    .track { flex: 1; height: 7px; border-radius: 999px; background: #e2e8f0; overflow: hidden; }
    .track span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #2563eb, #06b6d4); transition: width .35s; }
    @media (max-width: 720px) { main { padding: 16px; } header { display: block; } .badge { display: inline-block; margin-top: 12px; } .stage { padding: 18px; } .stairs { height: 220px; gap: 4px; } .step { width: 19%; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>爬楼梯：从状态定义到转移方程</h1>
        <p>用可播放的逐步动画观察 <b>dp[i] = dp[i-1] + dp[i-2]</b> 如何由“最后一步”推导出来。</p>
      </div>
      <span class="badge">多模态教学动画 · 42s</span>
    </header>
    <section class="stage" aria-live="polite">
      <div class="formula">dp[i] = dp[i-1] + dp[i-2]</div>
      <div class="stairs" id="stairs"></div>
      <div class="explain" id="explain">点击“播放”，系统将依次展示状态定义、边界、依赖来源、转移计算和最终结果。</div>
      <div class="controls">
        <button id="play" type="button">▶ 播放</button>
        <button id="next" type="button">下一步</button>
        <button id="reset" type="button">重置</button>
        <div class="timeline"><span id="counter">0 / 5</span><div class="track"><span id="bar"></span></div></div>
      </div>
    </section>
  </main>
  <script>
    const values = [1, 1, 2, 3, 5];
    const descriptions = [
      '① 定义状态：dp[i] 表示到达第 i 阶的方法数。先确定变量的语义，再写公式。',
      '② 设置边界：dp[0] = 1，dp[1] = 1。边界决定后续所有计算是否正确。',
      '③ 分析最后一步：到达第 i 阶，只可能从 i-1 阶走 1 步，或从 i-2 阶走 2 步。',
      '④ 合并互斥选择：两类路径不重叠，因此将方法数相加，得到 dp[i] = dp[i-1] + dp[i-2]。',
      '⑤ 按依赖顺序填表：1, 1, 2, 3, 5。每个状态只读取已经计算好的前两项。'
    ];
    const stairs = document.querySelector('#stairs');
    values.forEach((value, index) => {
      const node = document.createElement('div');
      node.className = 'step'; node.style.setProperty('--i', index);
      node.innerHTML = `<strong>dp[${index}]</strong><span>${value}</span>`;
      stairs.appendChild(node);
    });
    const nodes = [...document.querySelectorAll('.step')];
    let index = 0; let timer = null;
    const explain = document.querySelector('#explain');
    const play = document.querySelector('#play');
    function render() {
      nodes.forEach((node, i) => {
        node.className = 'step';
        if (index === 2 && (i === 0 || i === 1)) node.classList.add('source');
        if (index === 3 && (i === 1 || i === 2)) node.classList.add('source');
        if (i < index) node.classList.add('done');
        if (i === Math.min(index, 4)) node.classList.add('active');
      });
      explain.textContent = index ? descriptions[index - 1] : '点击“播放”，系统将依次展示状态定义、边界、依赖来源、转移计算和最终结果。';
      document.querySelector('#counter').textContent = `${index} / 5`;
      document.querySelector('#bar').style.width = `${index * 20}%`;
      if (index >= 5 && timer) pause();
    }
    function next() { index = Math.min(5, index + 1); render(); }
    function pause() { clearInterval(timer); timer = null; play.textContent = '▶ 播放'; }
    play.addEventListener('click', () => {
      if (timer) return pause();
      if (index >= 5) index = 0;
      play.textContent = '⏸ 暂停'; next(); timer = setInterval(next, 1700);
    });
    document.querySelector('#next').addEventListener('click', () => { pause(); next(); });
    document.querySelector('#reset').addEventListener('click', () => { pause(); index = 0; render(); });
    render();
  </script>
</body>
</html>
